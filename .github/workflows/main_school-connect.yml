
name: Deploy SCHOOL CONNECT to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_060BA276E0FC495FBA800B22C39CE6C5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A498F3B66935443C88F27AFF456868EF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_16C441424D704215BBEFCE855A8D3151 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'school-connect'
          slot-name: 'Production'
          package: .
